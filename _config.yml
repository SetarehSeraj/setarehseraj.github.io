###########################################################
### Beautiful Jekyll configuration — Setareh Seraj
### Replaces the theme's demo settings. Content lives in the
### .md pages; you rarely need to come back to this file.
###########################################################

############################
# --- Required options --- #
############################

# Name of website
title: Setareh Seraj

# Your name to show in the footer
author: Setareh Seraj

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  Home: "/"
  Research: "research"
  Teaching: "teaching"
  Vitae: "cv"
  More about me: "aboutme"


################
# --- Logo --- #
################

# Navbar image — commented out for now so the theme's generic icon doesn't
# show next to your name. AFTER you upload your headshot to
# assets/img/headshot.jpg, delete the leading '#' from these two lines:
#avatar: "/assets/img/headshot.jpg"
#round-avatar: true

#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  email: "setareh.seraj@baruch.cuny.edu"
  linkedin: "setarehseraj"
  github: "SetarehSeraj"
#  google-scholar: "Setareh Seraj"    # add when you create your Scholar profile
#  ORCID: "0000-0000-0000-0000"         # optional, if you ever register one

# RSS feed description (the feed lives at /feed.xml)
rss-description: Setareh Seraj — research, teaching, and updates

###########################
# --- General options --- #
###########################

# Social sharing buttons on blog posts — off (no posts on this site for now)
share-links-active:
  twitter: false
  facebook: false
  linkedin: false
  vk: false
  reddit: false

# How the link to your website is displayed in the footer
url-pretty: "setarehseraj.github.io"

# Add the website title to the title of every page
title-on-all-pages: true

# Excerpt word length - truncate the excerpt of each post on the feed page
excerpt_length: 50

# Whether or not to show an excerpt for every blog post in the feed page
feed_show_excerpt: true

# Whether or not to show a list of tags below each post preview in the feed page
feed_show_tags: true

# Search button in the navbar — off for a cleaner look on a three-page site
post_search: false

# "Edit page" button in the footer — off
edit_page_button: false

# Allow sub-menu items to be longer than the top-level menu
navbar-var-length: false

# Keywords to associate with your website, for SEO
keywords: "Setareh Seraj, information systems, Baruch College, CUNY, Zicklin School of Business, academic job market, econometrics, text mining"

site-css:
  - "/assets/css/custom-styles.css"
  
######################################
# --- Colours / background image --- #
######################################

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

#################################
# --- Web Analytics Section --- #
#################################

# Google Analytics — fill in a tag ID later if you ever want visitor stats
#gtag: "G-XXXXXXXXXX"

################
# --- Misc --- #
################

# Ruby date format to show dates of posts
date_format: "%B %-d, %Y"

#################################################################################
# --- You don't need to touch anything below here (but you can if you want) --- #
#################################################################################

timezone: "America/New_York"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5
kramdown:
  input: GFM

# Default YAML values
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
  -
    scope:
      path: "" # any file that's not a post will be a "page" layout by default
    values:
      layout: "page"

# Exclude these files from the production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap

